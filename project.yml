name: AVGStudio
options:
  bundleIdPrefix: com.avgstudio
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AVGStudio:
    type: application
    platform: iOS
    sources:
      - AVGStudio
    info:
      path: AVGStudio/Info.plist
      properties:
        CFBundleDisplayName: AVG Studio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: "AVG Studio saves your rendered videos to Photos."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Lets a render opportunistically continue after the app is
        # backgrounded, via BGProcessingTask - see Core/BackgroundRender.swift
        # for exactly what this can and can't promise.
        BGTaskSchedulerPermittedIdentifiers:
          - com.avgstudio.app.render
        # Skin v2 (see SKIN_V2_PLAN.md) - display headings use the
        # bundled Caprasimo font (OFL-licensed, Resources/), with a
        # system-serif fallback baked into Theme.disp itself.
        UIAppFonts:
          - Caprasimo-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avgstudio.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AVGStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AVGStudioTests
    dependencies:
      - target: AVGStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.avgstudio.app.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  AVGStudio:
    build:
      targets:
        AVGStudio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AVGStudioTests
    archive:
      config: Release
